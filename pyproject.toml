[project]
name = "time_series"
version = "0.1.0"
description = "VN-Index volatility modeling with GARCH-family and Google Trends (SVI)."
readme = "README.md"
requires-python = ">= 3.12"
authors = [
    { name = "Vu Ngoc Duong", email = "vungocduong255@gmail.com" }
]
dependencies = [
    "loguru>=0.7.0",
    "pydantic>=2.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "arch>=6.3.0",
    "vnstock>=3.0.0",
    "pytrends>=4.9.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/time_series"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "pyright>=1.1.350",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
